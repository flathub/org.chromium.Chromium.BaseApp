id: org.chromium.Chromium.BaseApp
branch: '25.08'
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
separate-locales: false
modules:

  - name: libsecret
    buildsystem: meson
    config-opts:
      - -Dmanpage=false
      - -Dcrypto=disabled
      - -Dvapi=false
      - -Dgtk_doc=false
      - -Dintrospection=false
      - -Dbash_completion=disabled
    cleanup:
      - /bin
      - /include
      - /lib/pkgconfig
      - /share/man
    sources:
      - type: archive
        url: https://download.gnome.org/sources/libsecret/0.21/libsecret-0.21.7.tar.xz
        sha256: 6b452e4750590a2b5617adc40026f28d2f4903de15f1250e1d1c40bfd68ed55e

  - name: krb5
    subdir: src
    config-opts:
      - --localstatedir=/var/lib
      - --sbindir=${FLATPAK_DEST}/bin
      - --disable-static
      - --disable-rpath
    sources:
      - type: archive
        url: https://github.com/krb5/krb5/archive/refs/tags/krb5-1.22.2-final.tar.gz
        sha256: 289f5bb81d1f2f8d5eecebe56a056aeed95d35fd9bb4a7071c5dd7ad4b3fe888
        x-checker-data:
          type: anitya
          project-id: 13287
          stable-only: true
          url-template: https://github.com/krb5/krb5/archive/refs/tags/krb5-$version.tar.gz
      - type: shell
        dest: src
        commands:
          - autoreconf -si
    cleanup:
      - /bin
      - /share/et
      - /share/examples
      - /share/man

  - name: krb5-config
    buildsystem: simple
    build-commands:
      - install -Dm 644 krb5.conf -t /app/etc
    sources:
      - type: file
        path: krb5.conf

  - name: qt6-base
    buildsystem: cmake-ninja
    builddir: true
    config-opts:
      - -DCMAKE_BUILD_TYPE=RelWithDebInfo
      - -DINSTALL_ARCHDATADIR=lib/qt6
      - -DQT_DISABLE_RPATH=ON
      - -DBUILD_WITH_PCH=FALSE
      - -DQT_FEATURE_glibc_fortify_source=OFF # The SDK already defines _FORTIFY_SOURCE=3, suppress warnings about redefinition
      - -DQT_FEATURE_concurrent=OFF   # libQtConcurrent.so
      - -DQT_FEATURE_eglfs=OFF        # libQt6EglFS*.so, plugins/egldeviceintegrations/, plugins/platforms/libqeglfs.so
      - -DQT_FEATURE_evdev=OFF        # plugins/generic/libqevdev*.so
      - -DQT_FEATURE_linuxfb=OFF      # plugins/platforms/libqlinuxfb.so
      - -DQT_FEATURE_network=OFF      # libQt6Network.so, plugins/networkinformation/, plugins/tls/, plugins/platforms/libqvnc.so
      - -DQT_FEATURE_printsupport=OFF # libQt6PrintSupport.so, plugins/printsupport/
      - -DQT_FEATURE_sql=OFF          # libQt6Sql.so, plugins/sqldrivers/
      - -DQT_FEATURE_testlib=OFF      # libQt6Test.so
      - -DQT_FEATURE_vkkhrdisplay=OFF # plugins/platforms/libqvkkhrdisplay.so
      - -DQT_FEATURE_xml=OFF          # libQt6Xml.so
    post-install:
      - cp ${FLATPAK_BUILDER_BUILDDIR}/LICENSES/* ${FLATPAK_DEST}/share/licenses/${FLATPAK_ID}/qt6-base/
    cleanup:
      - '*.a'
      - '*.prl'
      - /bin
      - /doc
      - /include
      - /lib/cmake
      - /lib/pkgconfig
      - /lib/qt6/libexec
      - /lib/qt6/metatypes
      - /lib/qt6/modules
      - /lib/qt6/sbom
      - /mkspecs
      - /share/qt6
    sources:
      - type: archive
        url: https://download.qt.io/official_releases/qt/6.11/6.11.2/submodules/qtbase-everywhere-src-6.11.2.tar.xz
        sha256: 5b2e00eccaf5a4d8c14134ffa0ea8dfd0a35ae1ffc7f8d87fa4305a1ed23cf22
        x-checker-data:
          type: anitya
          project-id: 7927
          stable-only: true
          url-template: https://download.qt.io/official_releases/qt/$major.$minor/$version/submodules/qtbase-everywhere-src-$version.tar.xz

  - name: flextop
    buildsystem: meson
    sources:
      - type: git
        url: https://github.com/refi64/flextop
        tag: v2022.03
        commit: 83c73e435630b94a6f44abe67cb268eae5b229b4
        x-checker-data:
          type: git
          tag-pattern: ^v([\d.]+)$

  - name: cobalt
    buildsystem: meson
    sources:
      - type: git
        url: https://github.com/refi64/cobalt
        tag: v2024.10
        commit: b56afa0d44121975d69b8aa1b366e381be6839a0
        x-checker-data:
          type: git
          tag-pattern: ^v([\d.]+)$
